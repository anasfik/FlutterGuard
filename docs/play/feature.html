<!doctype html><html><head><meta charset="utf-8"><style>
 html,body{margin:0;width:1024px;height:500px;overflow:hidden}
 html{background:#070A0F;background-image:radial-gradient(1250px 780px at 74% -6%, rgba(34,211,238,.20), rgba(0,0,0,0) 74%),radial-gradient(1000px 700px at 0% 108%, rgba(34,211,238,.10), rgba(0,0,0,0) 70%),linear-gradient(178deg,#0A1F28 0%,#08151C 58%,#060D13 100%)}
 body{background:#070A0F;color:#EAF6FF;font-family:'Lato',sans-serif;
      background:transparent;
      display:flex;align-items:center;gap:40px;padding:0 64px;box-sizing:border-box}
 .mark{width:148px;height:148px;flex:none;border-radius:34px;
       background:radial-gradient(120% 120% at 30% 18%, #0A5A63 0%, #00363D 60%, #002A30 100%);
       border:1px solid rgba(77,217,232,.35);box-shadow:0 0 70px rgba(34,211,238,.30);
       display:flex;align-items:center;justify-content:center}
 h1{font-size:62px;font-weight:900;letter-spacing:-1.2px;margin:0}
 p{margin:14px 0 0;font-size:26px;font-weight:500;color:#8FB3C7;letter-spacing:.01em}
 .tag{margin-top:22px;display:flex;gap:12px}
 .chip{font-size:20px;color:#9FE8F7;border:1px solid rgba(34,211,238,.30);
       background:rgba(34,211,238,.08);border-radius:999px;padding:8px 18px}
</style></head><body>
 <div class="mark">
  <svg width="104" height="104" viewBox="0 0 108 108">
   <path d="M54,19 L82,29 L82,53 C82,72 70,84 54,91 C38,84 26,72 26,53 L26,29 Z"
         fill="#00232A" stroke="#4DD9E8" stroke-width="3.2" stroke-linejoin="round"/>
   <path d="M52,39 a11,11 0 1,0 0.1,0 z" fill="none" stroke="#4DD9E8" stroke-width="4.2"/>
   <path d="M60.5,49 L71,60" stroke="#4DD9E8" stroke-width="5.2" stroke-linecap="round"/>
  </svg>
 </div>
 <div>
  <h1>FlutterGuard</h1>
  <p>On-device security audit for the Flutter apps on your phone</p>
  <div class="tag"><span class="chip">No root</span><span class="chip">No PC</span><span class="chip">No network permission</span></div>
 </div>
</body></html>
