<!doctype html><html lang="en"><meta charset="utf-8"><title>FlutterGuard feature graphic</title>
<style>
 :root{--base:#0e1110;--ink:#f0f2ed;--muted:#b3bcb5;--accent:#9ee6ad;--line:#303a33;
 --font: 'Lato',sans-serif;--mono:'DejaVu Sans Mono',monospace;--unit:8px}
 *{box-sizing:border-box}html,body{margin:0;width:1024px;height:500px;background:var(--base);color:var(--ink)}
 body{padding:64px;font-family:var(--font);position:relative}
 header{display:flex;align-items:center;gap:24px}header img{width:72px;height:72px}header strong{font-size:40px;letter-spacing:-1px}
 h1{margin:32px 0 24px;font-size:64px;line-height:1.04;letter-spacing:-2px;font-weight:900}h1 span{color:var(--accent)}
 footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px;font:16px var(--mono);color:var(--muted)}
</style>
<body><header><img src="../brand/favicon.svg" alt=""><strong>FlutterGuard</strong></header>
<h1>Inspect the app.<br><span>Keep the evidence.</span></h1>
<footer><span>Offline Flutter APK audits</span><span>No root. No account.</span></footer></body></html>
