name: apk-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The CLI's own end-to-end tests run on the generated fixture, so they must
      # pass before any artifact is produced.
      - name: Test the CLI
        run: ./gradlew --no-daemon :cli:test

      - name: Build CLI distribution
        run: ./gradlew --no-daemon :cli:installDist

      # Owned fixture: FlutterGuard's own debug APK. It is generated by this
      # repository, so the scan needs no third-party artifact.
      - name: Build owned fixture APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Scan the fixture
        run: |
          mkdir -p out
          cli/build/install/flutterguard/bin/flutterguard scan \
            app/build/outputs/apk/debug/app-debug.apk \
            --json out/flutterguard-report.json \
            --sarif out/flutterguard-report.sarif

      # Runs only once the benchmark harness is tracked in the repository.
      - name: Assertion benchmark
        if: hashFiles('benchmarks/harness.py') != ''
        run: |
          python3 benchmarks/harness.py \
            --manifest benchmarks/manifests/flutter-fixtures.json \
            --cli cli/build/install/flutterguard/bin/flutterguard \
            --json-out out/benchmark.json --md-out out/benchmark.md

      - name: Retain report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutterguard-scan
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # Separate job so only the upload holds security-events: write. GitHub Actions
  # has no step-level permissions; actions: read is required by upload-sarif on
  # private repositories. Fork pull requests cannot write security events, so the
  # job is skipped there instead of failing.
  upload-sarif:
    needs: scan
    if: always() && needs.scan.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutterguard-scan
          path: out

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/flutterguard-report.sarif
